services:
  platform-service-php:
    image: p11-php
    container_name: platform-service-php
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/var/www/html/logs
    networks:
      - platform-service-network

  platform-service-nginx:
    image: zzwsec/nginx:1.31.3
    container_name: platform-service-nginx
    restart: unless-stopped
    ports:
      - 20808:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
    ulimits:
      nofile:
        soft: 102400
        hard: 102400
    depends_on:
      - platform-service-php
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - platform-service-network

networks:
  platform-service-network:
    driver: bridge
