worker_processes ${{NUM_WORKERS}};
worker_shutdown_timeout 10s;
pcre_jit on;
daemon off;
user  openresty;

# Nginx 默认会移除继承的环境变量，除非在此处显式声明。
# Lapis 会在 worker 进程内部惰性读取这些变量。
env MYSQL_HOST;
env MYSQL_PORT;
env MYSQL_USER;
env MYSQL_PASSWORD;
env MYSQL_DATABASE;
env REDIS_HOST;
env REDIS_PORT;
env REDIS_PASSWORD;
env REDIS_NAMESPACE;
env TZ;

events {
  worker_connections 2048;
}

http {
  include /etc/openresty/mime.types;
  default_type  application/json;
  server_tokens off;

  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  sendfile        on;
  keepalive_timeout  65;

  lua_shared_dict cache_shm      15m;
  lua_shared_dict cache_shm_miss 1m;
  lua_shared_dict ipc_shm        1m;

  # lua库路径
  lua_package_path "${{LUA_PATH}};;";
  lua_package_cpath "${{LUA_CPATH}};;";

  init_by_lua_block {
    require("lpeg")
  }

  server {
    listen ${{PORT}};
    lua_code_cache ${{CODE_CACHE}};

    location = /health {
      access_log off;
      content_by_lua_block {
        require("lapis").serve("app")
      }
    }

    location / {
      content_by_lua_block {
        require("lapis").serve("app")
      }
    }
  }
}
